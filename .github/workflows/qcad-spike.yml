name: QCAD CE native spike
on:
  workflow_dispatch:
  push:
    branches: ['codex/qcad-build-spike']
  pull_request:
    paths: ['native/**', 'src/opencad/**', 'examples/**', 'tests/**', 'packaging/**', 'CMakeLists.txt', 'tools/*qcad*', 'tools/prepare_inno.ps1', 'tools/verify_windows_install.ps1', 'tools/cad_workflow.py', '.github/workflows/qcad-spike.yml']
permissions:
  contents: read
jobs:
  windows-native:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . aqtinstall==3.3.0 cmake==4.1.3 ninja==1.13.0
      - name: Fetch audited QCAD source
        shell: pwsh
        run: |
          git init .cache/upstream/qcad
          git -C .cache/upstream/qcad remote add origin https://github.com/qcad/qcad.git
          git -C .cache/upstream/qcad fetch --depth 1 origin 4c830eb4d80285ca64b1f2c2dc0987f729344126
          git -C .cache/upstream/qcad checkout --detach FETCH_HEAD
      - run: python -m aqt install-qt windows desktop 6.10.3 win64_msvc2022_64 --outputdir .cache/qt --archives qtbase qtdeclarative qtsvg qttools
      - name: Build audited source and test geometry/document/DXF
        shell: pwsh
        run: |
          try { ./tools/build_qcad.ps1 *> build-native.log }
          finally { Get-Content -LiteralPath build-native.log }
      - run: ctest --test-dir build/native --output-on-failure
      - name: Package existing native build and compile installer
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.16.0 pefile==2023.2.7
          $cadVsWhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $cadVs=& $cadVsWhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $cadCrt=Get-ChildItem (Join-Path $cadVs 'VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT') -Directory | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          python tools/package_qcad_windows.py --crt $cadCrt
          if ($LASTEXITCODE -ne 0) {throw 'Package build failed'}
          $cadCompiler=./tools/prepare_inno.ps1
          & $cadCompiler ('/DPackageDir='+$PWD+'/build/windows-package/dist/OPEN-CAD-2D-Native') ('/DOutputPath='+$PWD+'/build/windows-package/installer') packaging/windows/opencad-native.iss
          if ($LASTEXITCODE -ne 0) {throw 'Installer compile failed'}
      - name: Installed integrated regression on build runner (not clean Windows)
        shell: pwsh
        run: |
          ./tools/verify_windows_install.ps1 -Installer ./build/windows-package/installer/OPEN-CAD-2D-QCAD-A1-Setup.exe -Output ($PWD.Path+'/build/installed-evidence')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QCAD-native-evidence
          path: |
            build-native.log
            build/native/geometry-report.json
            build/native/document-acceptance/
            build/native/application-acceptance/
            build/native/dxf-application/
            build/native/editing-acceptance/
            build/native/transforms-acceptance/
            build/native/curves-acceptance/
            build/native/cutting-acceptance/
            build/native/dimensions-acceptance/
            build/native/lisp-essential-acceptance/
            build/native/recovery-acceptance/
            build/native/regression.json
            build/native/Testing/Temporary/LastTest.log
            build/installed-evidence/
            build/windows-package/build-identity.json
          # Binary redistribution awaits corresponding-source/license review.
