[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-cad-2d"
version = "0.1.0.dev0"
description = "Prototipo verificable de OPEN CAD 2D"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["PySide6==6.10.3", "ezdxf==1.4.3"]

[project.scripts]
opencad = "opencad.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opencad = ["commands.json"]
